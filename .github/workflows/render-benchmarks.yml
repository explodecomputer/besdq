name: Render Westra benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'docs/performance-westra.ipynb'
      - 'data/westra_eqtl_hg19.*'
      - 'besdq/**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .
          pip install jupyter nbconvert

      - name: Execute and render notebook
        run: |
          jupyter nbconvert \
            --to markdown \
            --execute \
            --ExecutePreprocessor.timeout=300 \
            --output performance-westra.md \
            --output-dir docs/ \
            docs/performance-westra.ipynb

      - name: Commit rendered output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/performance-westra.md
          git diff --cached --quiet || git commit -m "docs: re-render Westra benchmark [skip ci]"
          git push
